services:
  db:
    image: postgres:15-alpine
    container_name: rio_db
    restart: always
    environment:
      TZ: America/Argentina/Buenos_Aires
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - rio_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: rio_api
    volumes:
      - ./api:/app/api
      - ./common:/app/common
    environment:
      TZ: America/Argentina/Buenos_Aires
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - rio_network

  scraper:
    build:
      context: .
      dockerfile: scraper/Dockerfile
    volumes:
      - ./scraper:/app/scraper
      - ./common:/app/common
    container_name: rio_scraper
    restart: always
    environment:
      TZ: America/Argentina/Buenos_Aires
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - rio_network

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      args:
        VITE_CARTO_API_KEY: ${VITE_CARTO_API_KEY}
    container_name: rio_dashboard
    restart: always
    ports:
      - "${DASHBOARD_PORT:-3000}:80"
    depends_on:
      - api
    networks:
      - rio_network

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: rio_admin
    restart: always
    ports:
      - "${ADMIN_PORT:-8080}:80"
    depends_on:
      - api
    networks:
      - rio_network

networks:
  rio_network:
    driver: bridge

volumes:
  postgres_data:
