server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy hacia la API (reemplaza el proxy de Vite en desarrollo)
    # Las requests a /api/* se reenvían a http://api:8000/*
    location /api/ {
        proxy_pass         http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SPA fallback: cualquier ruta no encontrada devuelve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cacheo agresivo de assets con hash en el nombre (Vite los genera así)
    location ~* \.(?:js|css|woff2?|svg|png|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Deshabilitar logs de favicon para no ensuciar
    location = /favicon.ico {
        log_not_found off;
        access_log    off;
    }
}
